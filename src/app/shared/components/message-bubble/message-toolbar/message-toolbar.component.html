<div class="toolbar" role="toolbar" aria-label="Message actions">
  <button
    appIconButton
    type="button"
    label="Add reaction"
    [attr.aria-expanded]="pickerOpen()"
    (click)="requestReaction($event)"
  >
    <app-icon name="smile-plus" [size]="iconSize" />
  </button>
  @if (!inThread()) {
    <button appIconButton type="button" label="Reply in thread" (click)="command.emit('thread')">
      <app-icon name="messages-square" [size]="iconSize" />
    </button>
  }
  <button appIconButton type="button" [label]="saveLabel()" (click)="command.emit('save')">
    <app-icon [name]="saveIcon()" [size]="iconSize" />
  </button>
  <button
    appIconButton
    type="button"
    label="More actions"
    [cdkMenuTriggerFor]="moreMenu"
    [cdkMenuPosition]="menuPositions"
    (cdkMenuOpened)="menuOpenChange.emit(true)"
    (cdkMenuClosed)="menuOpenChange.emit(false)"
  >
    <app-icon name="ellipsis" [size]="iconSize" />
  </button>
</div>

<ng-template #moreMenu>
  <div appDropdownPanel="More message actions">
    <app-dropdown label="More message actions">
      @for (item of items(); track item.kind) {
        <button
          appDropdownItem
          [tone]="item.destructive ? 'danger' : 'default'"
          (triggered)="command.emit(item.kind)"
        >
          <app-icon [name]="item.icon" [size]="iconSize" />
          {{ item.label }}
        </button>
      }
    </app-dropdown>
  </div>
</ng-template>
