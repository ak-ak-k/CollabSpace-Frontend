<app-icon name="wifi-off" [size]="16" />
<span class="offline-banner__message">
  <strong>You’re offline.</strong>
  Showing what’s already loaded — messages you send are queued until you reconnect.
</span>
<a class="offline-banner__link" routerLink="/offline">Details</a>
<button type="button" class="offline-banner__retry" (click)="retry.emit()">Retry</button>
