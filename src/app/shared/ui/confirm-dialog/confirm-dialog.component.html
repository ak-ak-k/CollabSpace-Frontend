<div class="confirm-dialog__summary">
  <span class="confirm-dialog__tile">
    <app-icon [name]="data.icon" [size]="18" />
  </span>
  <div class="confirm-dialog__text">
    <h2 class="confirm-dialog__title" [id]="titleId">{{ data.title }}</h2>
    <p class="confirm-dialog__body" [id]="bodyId">{{ data.body }}</p>
  </div>
</div>

@if (needsTyping) {
  <div class="confirm-dialog__type">
    <label class="confirm-dialog__type-label" [for]="typeId">
      Type <strong>{{ data.confirmText }}</strong> to confirm
    </label>
    <input
      #typeInput
      class="confirm-dialog__type-input"
      type="text"
      autocomplete="off"
      spellcheck="false"
      cdkFocusInitial
      [id]="typeId"
      [value]="typed()"
      (input)="typed.set(typeInput.value)"
      (keydown.enter)="confirmTyped($event)"
    />
  </div>
}

<div class="confirm-dialog__actions">
  <button
    appButton
    type="button"
    variant="secondary"
    [attr.cdkFocusInitial]="focusesCancel ? '' : null"
    (click)="cancel()"
  >
    {{ data.cancelLabel }}
  </button>
  <button
    appButton
    type="button"
    [variant]="data.tone === 'neutral' ? 'inverted' : 'primary'"
    [attr.cdkFocusInitial]="focusesConfirm ? '' : null"
    [disabled]="blocked()"
    (click)="confirm()"
  >
    {{ data.confirmLabel }}
  </button>
</div>
