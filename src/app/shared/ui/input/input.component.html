<div class="field__header">
  <label class="field__label" [class.visually-hidden]="hideLabel()" [attr.for]="controlId">
    {{ label() }}
    @if (optional()) {
      <span class="field__optional">(optional)</span>
    }
  </label>
  <ng-content select="[labelAction]" />
</div>

<div class="field__body">
  <input
    #control
    class="field__control"
    [class.field__control--large]="size() === 'lg'"
    [class.field__control--invalid]="error().invalid"
    [class.field__control--revealable]="canReveal()"
    [id]="controlId"
    [type]="nativeType()"
    [value]="value()"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [attr.name]="name() || null"
    [attr.placeholder]="placeholder() || null"
    [attr.autocomplete]="autocomplete() || null"
    [attr.inputmode]="inputmode() || null"
    [attr.maxlength]="maxlength() ?? null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="error().invalid ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="value.set(control.value)"
    (blur)="touch.emit()"
  />
  @if (canReveal()) {
    <button
      type="button"
      class="field__action"
      [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="revealed()"
      [disabled]="disabled()"
      (click)="toggleReveal()"
    >
      <app-icon [name]="revealed() ? 'eye-off' : 'eye'" [size]="18" />
    </button>
  }
</div>

@if (hint()) {
  <p class="field__hint" [attr.id]="hintId">{{ hint() }}</p>
}
@if (error().message) {
  <app-field-error [attr.id]="errorId" [message]="error().message" />
}
