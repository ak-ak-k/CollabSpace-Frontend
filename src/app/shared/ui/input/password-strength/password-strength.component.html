@if (visible()) {
  <div class="strength__bars" aria-hidden="true">
    @for (position of barPositions; track position) {
      <span
        class="strength__bar"
        [class.strength__bar--filled]="position < strength().score"
      ></span>
    }
  </div>
}
<p class="strength__summary" aria-live="polite" aria-atomic="true">
  @if (visible()) {
    Strength: <strong class="strength__label">{{ strength().label }}</strong> ·
    {{ strength().tip }}
  }
</p>
