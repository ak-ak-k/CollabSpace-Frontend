@if (visible()) {
  <nav class="pagination" [attr.aria-label]="label()">
    <p class="pagination__summary" role="status">{{ summary() }}</p>
    <div class="pagination__controls">
      <button
        appIconButton
        type="button"
        label="Previous page"
        size="md"
        [disabled]="onFirstPage()"
        (click)="showPrevious()"
      >
        <app-icon name="chevron-left" [size]="18" />
      </button>
      <button
        appIconButton
        type="button"
        label="Next page"
        size="md"
        [disabled]="onLastPage()"
        (click)="showNext()"
      >
        <app-icon name="chevron-right" [size]="18" />
      </button>
    </div>
  </nav>
}
