<nav [attr.aria-label]="label()">
  @if (parent(); as previous) {
    <a class="breadcrumb__back" [routerLink]="previous.link">
      <app-icon name="arrow-left" [size]="16" />
      {{ previous.label }}
    </a>
  }
  <ol class="breadcrumb__trail">
    @for (item of items(); track $index) {
      <li class="breadcrumb__item">
        @if ($last) {
          <span class="breadcrumb__current" aria-current="page">{{ item.label }}</span>
        } @else {
          @if (item.link; as link) {
            <a class="breadcrumb__link" [routerLink]="link">{{ item.label }}</a>
          } @else {
            <span>{{ item.label }}</span>
          }
          <span class="breadcrumb__separator" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
