@for (toast of toasts(); track toast.id) {
  <div
    class="toast"
    role="status"
    (mouseenter)="toastService.hold(toast.id)"
    (mouseleave)="toastService.release(toast.id)"
    (focusin)="toastService.hold(toast.id)"
    (focusout)="toastService.release(toast.id)"
  >
    <app-icon [name]="toast.icon" [size]="18" />
    <span class="toast__message">{{ toast.message }}</span>
    @if (toast.actionLabel) {
      <button type="button" class="toast__action" (click)="toastService.runAction(toast.id)">
        {{ toast.actionLabel }}
      </button>
    }
    <button
      appIconButton
      type="button"
      class="toast__dismiss"
      label="Dismiss"
      (click)="toastService.dismiss(toast.id)"
    >
      <app-icon name="x" [size]="16" />
    </button>
  </div>
}
