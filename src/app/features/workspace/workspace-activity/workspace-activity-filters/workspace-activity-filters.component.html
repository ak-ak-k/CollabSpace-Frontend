<div class="activity-filters__row">
  <app-radio-group
    #ownerGroup
    label="Whose activity"
    hideLabel
    [options]="ownerOptions"
    [value]="filters().owner"
    (valueChange)="setOwner($event)"
  />
  <app-select
    class="activity-filters__team"
    label="Team"
    [options]="teamOptions()"
    [value]="filters().teamId"
    (valueChange)="setTeam($event)"
  />
  <app-radio-group
    class="activity-filters__range"
    label="Date range"
    hideLabel
    [options]="dateOptions"
    [value]="filters().range"
    (valueChange)="setRange($event)"
  />
</div>

<div class="activity-filters__chips" role="group" aria-label="Activity type">
  @for (chip of typeChips; track chip.value) {
    <button
      type="button"
      class="activity-filters__chip"
      [class.activity-filters__chip--on]="chip.value === filters().type"
      [attr.aria-pressed]="chip.value === filters().type"
      (click)="setType(chip.value)"
    >
      {{ chip.label }}
    </button>
  }
</div>
