<section aria-labelledby="workspace-activity-heading">
  <app-section-header
    headingId="workspace-activity-heading"
    heading="Recent activity"
    [caption]="caption()"
  />

  @if (items().length === 0) {
    <app-empty-state
      compact
      [headingLevel]="3"
      icon="activity"
      heading="No activity yet"
      message="New members, teams, channels and role changes will show up here."
    />
  } @else {
    <app-activity-feed [items]="shown()" label="Recent activity in this workspace" />
  }

  <a appButton variant="ghost" class="events__all" [routerLink]="activityRoute">
    View all activity
    <app-icon name="arrow-right" [size]="14" />
  </a>
</section>
