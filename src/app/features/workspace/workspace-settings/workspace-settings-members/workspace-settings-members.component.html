@if (preferences(); as settings) {
  <ul class="policy">
    <li appSettingRow wrap label="Who can invite people" description="Guests can never invite.">
      <app-radio-group
        label="Who can invite people"
        hideLabel
        [options]="policyOptions"
        [value]="settings.whoCanInvite"
        (valueChange)="setInvitePolicy($event)"
      />
    </li>
    <li
      appSettingRow
      wrap
      label="Default role for invitations"
      description="People can still choose a different role when they invite."
    >
      <app-select
        label="Default role for invitations"
        hideLabel
        [options]="roleOptions"
        [value]="settings.defaultRole"
        (valueChange)="setDefaultRole($event)"
      />
    </li>
    <li
      appSettingSwitch
      label="Only allow approved email domains"
      description="Invitations to other domains will be blocked."
      [checked]="settings.restrictDomains"
      (checkedChange)="setRestricted($event)"
    ></li>
    @if (settings.restrictDomains) {
      <li class="policy__domains">
        <form
          class="domains"
          novalidate
          aria-label="Approved domains"
          (submit)="saveDomains($event)"
        >
          <app-input
            class="domains__field"
            label="Approved domains"
            placeholder="northstar.io, northstar.dev"
            hint="Separate several domains with commas."
            autocomplete="off"
            [formField]="domainsForm"
          />
          <button appButton type="submit">Save domains</button>
        </form>
      </li>
    }
  </ul>
}

<app-workspace-pending-invites />
