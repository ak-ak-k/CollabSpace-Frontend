<app-table label="Permissions by role" minWidth="md">
  <table class="matrix">
    <caption class="visually-hidden">
      Permissions by role
    </caption>
    <thead>
      <tr>
        <th scope="col">Permission</th>
        @for (role of roles; track role.role) {
          <th scope="col" class="matrix__role">{{ role.label }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.id) {
        <tr>
          <th scope="row" class="matrix__permission">{{ row.label }}</th>
          @for (cell of row.cells; track cell.role) {
            <td class="matrix__cell">
              <button
                type="button"
                role="switch"
                class="permission-switch"
                [class.permission-switch--allowed]="cell.allowed"
                [class.permission-switch--locked]="cell.locked"
                [class.permission-switch--editable]="cell.editable"
                [attr.aria-checked]="cell.allowed"
                [attr.aria-disabled]="cell.editable ? null : 'true'"
                [attr.aria-label]="cell.label"
                [appTooltip]="cell.hint"
                (click)="toggle(cell)"
              >
                <app-icon [name]="cell.allowed ? 'check' : 'x'" [size]="14" />
              </button>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</app-table>
