<div class="welcome__intro">
  <span class="caps-label">{{ today }}</span>
  <h1 class="welcome__title" id="dashboard-title">{{ greeting() }}</h1>
  <p class="welcome__summary">{{ summary() }}</p>
</div>

<div class="welcome__actions" role="group" aria-label="Quick actions">
  <button appButton variant="primary" size="lg" class="welcome__action" (click)="newMessage.emit()">
    <app-icon name="square-pen" [size]="18" />
    New message
  </button>
  <button appButton size="lg" class="welcome__action" (click)="newTask.emit()">
    <app-icon name="plus" [size]="18" />
    New task
  </button>
  <button appButton size="lg" class="welcome__action" (click)="invitePeople.emit()">
    <app-icon name="user-plus" [size]="18" />
    Invite people
  </button>
  <button appButton size="lg" class="welcome__action" (click)="chooseFiles()">
    <app-icon name="upload" [size]="18" />
    Upload file
  </button>
</div>

<input
  #filePicker
  class="visually-hidden"
  type="file"
  multiple
  tabindex="-1"
  aria-hidden="true"
  (change)="announceChosenFiles(filePicker)"
/>
