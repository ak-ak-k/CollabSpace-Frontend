<section class="section" [attr.aria-labelledby]="headingId">
  <div class="section__head">
    <h3 class="section__title" [id]="headingId">Activity</h3>
    <button
      appButton
      type="button"
      variant="ghost"
      size="sm"
      [attr.aria-expanded]="expanded()"
      (click)="toggle()"
    >
      <app-icon name="history" [size]="14" />
      {{ toggleLabel() }}
    </button>
  </div>
  @if (expanded() && rows().length) {
    <app-activity-feed
      [items]="rows()"
      variant="timeline"
      [showTeam]="false"
      label="Task activity"
    />
  }
  <p class="section__meta">{{ metaLine() }}</p>
</section>
