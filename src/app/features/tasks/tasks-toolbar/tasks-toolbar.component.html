<div class="toolbar" role="group" aria-label="Task tools">
  <app-search-input
    class="toolbar__search"
    label="Search tasks"
    placeholder="Search tasks or IDs"
    [(value)]="query"
  />
  @if (showPeople()) {
    <div class="toolbar__people" role="group" aria-label="Filter by assignee">
      @for (person of people(); track person.id) {
        <button
          type="button"
          class="toolbar__person"
          [class.toolbar__person--on]="assigneeIds().includes(person.id)"
          [attr.aria-pressed]="assigneeIds().includes(person.id)"
          [attr.aria-label]="'Show tasks for ' + person.name"
          [attr.title]="person.name"
          (click)="toggleAssignee(person.id)"
        >
          <app-avatar [name]="person.name" [seed]="person.seed" [size]="32" />
        </button>
      }
    </div>
  }
  <button
    #filtersButton
    appButton
    type="button"
    aria-haspopup="dialog"
    [attr.aria-expanded]="filtersOpen()"
    (click)="requestFilters()"
  >
    <app-icon name="sliders-horizontal" [size]="16" />
    {{ filterLabel() }}
  </button>
  <app-radio-group
    class="toolbar__layout"
    label="View"
    hideLabel
    [options]="layoutOptions"
    [value]="layout()"
    (valueChange)="changeLayout($event)"
  />
  @if (layout() === 'list') {
    <app-select
      class="toolbar__sort"
      label="Sort"
      inlineLabel
      [options]="sortOptions"
      [value]="sort()"
      (valueChange)="changeSort($event)"
    />
  }
  <span class="toolbar__spacer"></span>
  <span class="toolbar__count" aria-live="polite">{{ countLabel() }}</span>
</div>
