@let current = filters();

<header class="filters__header">
  <h2 class="filters__title" [id]="titleId">Filters</h2>
  <button appIconButton type="button" size="md" label="Close filters" (click)="close()">
    <app-icon name="x" [size]="18" />
  </button>
</header>

<div class="filters__group" role="group" [attr.aria-labelledby]="statusLabelId">
  <span class="filters__label" [id]="statusLabelId">Status</span>
  <div class="filters__chips">
    @for (option of statusOptions; track option.value; let first = $first) {
      <button
        type="button"
        class="filters__chip"
        [class.filters__chip--on]="current.statuses.includes(option.value)"
        [attr.aria-pressed]="current.statuses.includes(option.value)"
        [attr.cdkFocusInitial]="first ? '' : null"
        (click)="toggleStatus(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</div>

<div class="filters__group" role="group" [attr.aria-labelledby]="priorityLabelId">
  <span class="filters__label" [id]="priorityLabelId">Priority</span>
  <div class="filters__chips">
    @for (option of priorityOptions; track option.value) {
      <button
        type="button"
        class="filters__chip"
        [class.filters__chip--on]="current.priorities.includes(option.value)"
        [attr.aria-pressed]="current.priorities.includes(option.value)"
        (click)="togglePriority(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</div>

<app-select
  label="Team"
  size="lg"
  [options]="data.teamOptions()"
  [value]="data.teamId()"
  (valueChange)="data.selectTeam($event)"
/>

<app-radio-group
  label="Due"
  [options]="dueOptions"
  [value]="current.due"
  (valueChange)="setDue($event)"
/>

<div class="filters__group" role="group" [attr.aria-labelledby]="labelsLabelId">
  <span class="filters__label" [id]="labelsLabelId">Labels</span>
  <div class="filters__chips">
    @for (label of labelOptions; track label) {
      <button
        type="button"
        class="filters__chip"
        [class.filters__chip--on]="current.labels.includes(label)"
        [attr.aria-pressed]="current.labels.includes(label)"
        (click)="toggleLabel(label)"
      >
        {{ label }}
      </button>
    }
  </div>
</div>

<footer class="filters__footer">
  <button appButton type="button" size="lg" block (click)="data.clearAll()">Clear all</button>
  <button appButton type="button" size="lg" variant="inverted" block (click)="close()">
    {{ showLabel() }}
  </button>
</footer>
