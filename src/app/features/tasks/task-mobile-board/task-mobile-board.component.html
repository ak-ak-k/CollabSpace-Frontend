<app-tabs
  class="mobile__tabs"
  label="Status"
  gap="md"
  size="lg"
  bleed
  [tabs]="tabs()"
  [active]="activeStatus()"
  (activeChange)="select($event)"
/>
@if (column(); as current) {
  <div #panel class="mobile__panel" role="tabpanel" tabindex="-1" [attr.aria-label]="current.label">
    @for (card of current.cards; track card.id) {
      <app-task-mobile-card [card]="card" (moved)="focusPanel()" />
    } @empty {
      <p class="mobile__empty">No tasks in {{ current.label }}.</p>
    }
    @if (canCreate()) {
      <button appButton type="button" block (click)="add.emit(current.status)">
        <app-icon name="plus" [size]="16" />
        Add to {{ current.label }}
      </button>
    }
  </div>
}
