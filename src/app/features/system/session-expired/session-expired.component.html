<app-system-page
  kicker="Session"
  icon="clock"
  tileTone="warning"
  heading="Your session expired"
  message="For your security we sign you out after a period of inactivity. Log in again and you’ll land right back where you were."
>
  <button appButton type="button" variant="primary" size="lg" (click)="logInAgain()">
    <app-icon name="log-in" [size]="16" />
    Log in again
  </button>
  <button appButton type="button" size="lg" (click)="contactAdmin()">
    <app-icon name="mail" [size]="16" />
    Contact your admin
  </button>
</app-system-page>
