<app-system-page
  kicker="Network"
  icon="wifi-off"
  heading="You’re offline"
  message="CollabSpace can’t reach the network. Everything you’ve already opened is still here. Messages, task updates and invitations are saved on this device and sync when the connection returns — other changes need a connection."
  [lists]="lists"
>
  <button
    appButton
    type="button"
    variant="primary"
    size="lg"
    [busy]="checking()"
    (click)="tryAgain()"
  >
    @if (!checking()) {
      <app-icon name="refresh-cw" [size]="16" />
    }
    {{ checking() ? 'Checking connection…' : 'Try again' }}
  </button>
  <a appButton size="lg" routerLink="/home">
    <app-icon name="house" [size]="16" />
    Go to dashboard
  </a>
</app-system-page>
