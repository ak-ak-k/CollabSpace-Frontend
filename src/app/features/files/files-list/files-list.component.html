<ul class="list">
  @for (file of files(); track file.id) {
    <li class="list__row">
      <button
        type="button"
        class="list__open"
        [attr.aria-label]="file.openLabel"
        (click)="run('preview', file)"
      >
        <app-file-tile size="md" [type]="file.type" />
        <span class="list__text">
          <span class="list__name truncate">{{ file.name }}</span>
          <span class="list__meta truncate">{{ file.listMeta }}</span>
          <span class="list__meta truncate">{{ file.source.label }}</span>
        </span>
      </button>
      <button
        appIconButton
        type="button"
        size="lg"
        aria-haspopup="menu"
        [label]="file.menuLabel"
        [attr.aria-expanded]="sheetFileId() === file.id"
        (click)="openSheet(file)"
      >
        <app-icon name="ellipsis-vertical" [size]="20" />
      </button>
    </li>
  }
</ul>
