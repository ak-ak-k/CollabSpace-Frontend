<app-table [label]="heading()">
  <table class="files-table" [class.files-table--wide]="wide()">
    <caption class="visually-hidden">
      {{
        caption()
      }}
    </caption>
    <thead>
      <tr>
        <th appSortHeader [direction]="directionOf('name')" (sort)="sortBy.emit('name')">Name</th>
        <th scope="col" class="files-table__source">Source</th>
        @if (wide()) {
          <th scope="col" class="files-table__owner">Owner</th>
          <th
            appSortHeader
            class="files-table__size files-table__numeric"
            [direction]="directionOf('size')"
            (sort)="sortBy.emit('size')"
          >
            Size
          </th>
        }
        <th
          appSortHeader
          class="files-table__modified"
          [direction]="directionOf('modified')"
          (sort)="sortBy.emit('modified')"
        >
          Modified
        </th>
        <th scope="col" class="files-table__actions-head">
          <span class="visually-hidden">Actions</span>
        </th>
      </tr>
    </thead>
    <tbody>
      @for (file of files(); track file.id) {
        <tr>
          <th scope="row" class="files-table__name">
            <button
              type="button"
              class="files-table__open"
              [attr.aria-label]="file.openLabel"
              (click)="run('preview', file)"
            >
              <app-file-tile [type]="file.type" />
              <span class="files-table__text">
                <span class="files-table__title truncate">{{ file.name }}</span>
                <span class="files-table__type truncate">{{ file.typeLine }}</span>
              </span>
            </button>
          </th>
          <td class="files-table__cell">
            <app-file-source-link [source]="file.source" />
          </td>
          @if (wide()) {
            <td class="files-table__cell">
              <span class="files-table__person">
                <app-avatar [name]="file.ownerFullName" [seed]="file.ownerSeed" [size]="24" />
                <span class="truncate">{{ file.ownerName }}</span>
              </span>
            </td>
            <td class="files-table__cell files-table__numeric">{{ file.sizeLabel }}</td>
          }
          <td class="files-table__cell files-table__muted">{{ file.modifiedLabel }}</td>
          <td class="files-table__actions">
            <button
              appIconButton
              type="button"
              [label]="file.starLabel"
              [pressed]="file.starred"
              (click)="run('star', file)"
            >
              <app-icon name="star" [size]="16" [filled]="file.starred" />
            </button>
            <app-file-menu [file]="file" (action)="run($event, file)" />
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-table>
