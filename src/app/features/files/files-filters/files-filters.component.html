<header class="filters__header">
  <h2 class="filters__title" [id]="titleId">Filters</h2>
  <button appIconButton type="button" size="md" label="Close filters" (click)="close()">
    <app-icon name="x" [size]="18" />
  </button>
</header>

<div class="filters__group" role="group" [attr.aria-labelledby]="typeLabelId">
  <span class="filters__label" [id]="typeLabelId">Type</span>
  <div class="filters__types">
    @for (option of typeOptions; track option.value; let first = $first) {
      <button
        type="button"
        class="filters__type"
        [class.filters__type--on]="isTypeOn(option.value)"
        [attr.aria-pressed]="isTypeOn(option.value)"
        [attr.cdkFocusInitial]="first ? '' : null"
        (click)="toggle(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</div>

<app-select
  class="filters__select"
  label="Team"
  size="lg"
  [options]="data.teamOptions()"
  [value]="data.teamId()"
  (valueChange)="data.selectTeam($event)"
/>

<app-select
  class="filters__select"
  label="Uploaded by"
  size="lg"
  [options]="data.ownerOptions()"
  [value]="filters().ownerId"
  (valueChange)="setOwner($event)"
/>

<app-radio-group
  class="filters__segments"
  label="Source"
  [options]="sourceOptions"
  [value]="filters().source"
  (valueChange)="setSource($event)"
/>

<app-radio-group
  class="filters__segments"
  label="Modified"
  [options]="modifiedOptions"
  [value]="filters().modified"
  (valueChange)="setModified($event)"
/>

<footer class="filters__footer">
  <button appButton type="button" size="lg" block (click)="data.clearAll()">Clear all</button>
  <button appButton type="button" size="lg" variant="inverted" block (click)="close()">
    {{ showLabel() }}
  </button>
</footer>
