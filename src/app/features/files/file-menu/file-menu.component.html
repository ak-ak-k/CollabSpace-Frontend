<button
  appIconButton
  type="button"
  [label]="file().menuLabel"
  [cdkMenuTriggerFor]="menu"
  [cdkMenuPosition]="positions"
>
  <app-icon name="ellipsis" [size]="16" />
</button>

<ng-template #menu>
  <div [appDropdownPanel]="menuLabel()">
    <app-dropdown [label]="menuLabel()">
      @for (item of items(); track item.kind) {
        <button
          appDropdownItem
          [tone]="item.danger ? 'danger' : 'default'"
          (triggered)="action.emit(item.kind)"
        >
          <app-icon [name]="item.icon" [size]="16" />
          {{ item.label }}
        </button>
      }
    </app-dropdown>
  </div>
</ng-template>
