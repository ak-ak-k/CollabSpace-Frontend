<ul class="grid">
  @for (file of files(); track file.id) {
    <li class="card">
      <button
        type="button"
        class="card__preview"
        [attr.aria-label]="file.openLabel"
        (click)="run('preview', file)"
      >
        <app-file-tile size="preview" [type]="file.type" />
      </button>
      <div class="card__footer">
        <span class="card__text">
          <span class="card__name truncate">{{ file.name }}</span>
          <span class="card__meta truncate">{{ file.gridMeta }}</span>
        </span>
        <button
          appIconButton
          type="button"
          [label]="file.starLabel"
          [pressed]="file.starred"
          (click)="run('star', file)"
        >
          <app-icon name="star" [size]="16" [filled]="file.starred" />
        </button>
        <app-file-menu [file]="file" (action)="run($event, file)" />
      </div>
    </li>
  }
</ul>
