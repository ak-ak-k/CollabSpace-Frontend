<div class="toolbar" role="group" aria-label="File tools">
  <app-search-input
    class="toolbar__search"
    label="Search files"
    placeholder="Search name, type, owner or source"
    [(value)]="query"
  />
  <button
    #trigger
    appButton
    type="button"
    aria-haspopup="dialog"
    [attr.aria-expanded]="filtersOpen()"
    (click)="requestFilters()"
  >
    <app-icon name="sliders-horizontal" [size]="16" />
    {{ filterLabel() }}
  </button>
  @if (showLayout()) {
    <app-radio-group
      class="toolbar__layout"
      label="Layout"
      hideLabel
      [options]="layoutOptions"
      [(value)]="layout"
    />
  }
</div>
