<form class="invite" novalidate (submit)="submit($event)">
  <app-modal size="lg" [heading]="heading()" [description]="subtitle()">
    @if (result(); as outcome) {
      <app-invite-result [result]="outcome" />
    } @else {
      @if (banner()) {
        <div class="invite__banner" role="alert">
          <app-icon name="circle-alert" [size]="16" />
          <span>{{ banner() }}</span>
        </div>
      }
      <app-invite-email-rows
        [(rows)]="rows"
        [views]="rowViews()"
        [countLabel]="countLabel()"
        [policy]="policy()"
      />
      <div class="invite__fields">
        <app-select label="Role" [options]="roleOptions()" [hint]="roleHelp()" [(value)]="role" />
        <app-select label="Add to team (optional)" [options]="teamOptions()" [(value)]="teamId" />
      </div>
    }

    <ng-container modalActions>
      @if (result()) {
        <button appButton type="button" (click)="inviteMore()">
          <app-icon name="mail-plus" [size]="16" />
          Invite more
        </button>
        <button #doneButton appButton type="button" variant="inverted" (click)="close()">
          Done
        </button>
      } @else {
        <button appButton type="button" (click)="close()">Cancel</button>
        <button appButton type="submit" variant="primary" [busy]="busy()">
          @if (!busy()) {
            <app-icon name="send-horizontal" [size]="16" />
          }
          {{ submitLabel() }}
        </button>
      }
    </ng-container>
  </app-modal>
</form>
