<form class="create-channel" [formRoot]="channelForm">
  <app-modal
    heading="Create channel"
    description="Channels are where a team’s conversations happen."
    size="md"
  >
    @if (noTeams()) {
      <div class="create-channel__note" role="note">
        <span>
          Channels live inside teams, and {{ workspaceName() }} doesn’t have any teams yet.
        </span>
        <div>
          <button appButton type="button" (click)="createTeamFirst()">
            <app-icon name="users" [size]="16" />
            Create a team first
          </button>
        </div>
      </div>
    } @else {
      <app-channel-name-field
        label="Channel name"
        placeholder="design-reviews"
        hint="Lowercase, with hyphens instead of spaces."
        [maxlength]="nameMaxLength"
        [formField]="channelForm.name"
      />
      <app-select label="Team" [options]="teamOptions()" [formField]="channelForm.teamId" />
      <app-textarea
        label="Description"
        optional
        [rows]="2"
        placeholder="What is this channel about?"
        [maxlength]="descriptionMaxLength"
        [formField]="channelForm.description"
      />
      <app-radio-group
        class="create-channel__privacy"
        label="Privacy"
        stretch
        [options]="privacyOptions"
        [hint]="privacyHelp()"
        [formField]="channelForm.privacy"
      />
    }

    <ng-container modalActions>
      <button appButton type="button" (click)="cancel()">Cancel</button>
      <button
        appButton
        type="submit"
        variant="primary"
        [disabled]="noTeams()"
        [busy]="channelForm().submitting()"
      >
        <app-icon name="hash" [size]="16" />
        Create channel
      </button>
    </ng-container>
  </app-modal>
</form>
