@if (activity().length === 0) {
  <app-empty-state
    icon="activity"
    heading="No activity yet"
    message="Messages, files and task updates from this team will show up here."
  />
} @else {
  <app-activity-feed
    class="activity"
    [items]="activity()"
    [showTeam]="false"
    showType
    label="Team activity"
  />
}
