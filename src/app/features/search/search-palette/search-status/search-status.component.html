<p class="visually-hidden" aria-live="polite">{{ liveCount() }}</p>

@switch (status()) {
  @case ('searching') {
    <p class="status__searching" role="status">
      <app-spinner class="status__spinner" />
      <span>Searching for “{{ term() }}”…</span>
    </p>
  }
  @case ('empty') {
    <div class="status__block">
      <span class="status__tile"><app-icon name="search" [size]="20" /></span>
      <strong class="status__title">No results for “{{ term() }}”</strong>
      <span class="status__hint">
        Check the spelling, try fewer words, or search a different category.
      </span>
    </div>
  }
  @case ('failed') {
    <div class="status__block status__block--alert" role="alert">
      <strong class="status__title">Search unavailable</strong>
      <span class="status__hint">We couldn’t load results.</span>
      <button appButton type="button" variant="secondary" (click)="retry.emit()">Retry</button>
    </div>
  }
}
