<header class="header">
  @if (backLink(); as link) {
    <a appIconButton size="lg" class="header__back" label="Back" [routerLink]="link">
      <app-icon name="arrow-left" [size]="22" />
    </a>
  }

  @if (view().channelIcon; as icon) {
    <span class="header__tile" aria-hidden="true"><app-icon [name]="icon" [size]="20" /></span>
  } @else {
    <app-avatar
      [name]="view().avatarName"
      [seed]="view().avatarSeed"
      [variant]="view().avatarVariant"
      [status]="view().avatarStatus"
      [size]="40"
    />
  }

  <div class="header__text">
    <h1 class="header__title">{{ view().title }}</h1>
    @if (subtitle()) {
      <span class="header__subtitle" [class.header__subtitle--typing]="typingText()">
        {{ subtitle() }}
      </span>
    }
  </div>

  @if (isChannel()) {
    @if (compact()) {
      <button
        type="button"
        class="header__members"
        [attr.aria-label]="membersLabel()"
        (click)="detailsToggled.emit()"
      >
        <app-icon name="users" [size]="16" />
        {{ view().memberCount }}
      </button>
    } @else {
      <button
        type="button"
        class="header__members"
        [attr.aria-label]="membersLabel()"
        (click)="detailsToggled.emit()"
      >
        <app-avatar-group [members]="view().members" [size]="26" />
        <span class="header__members-text">{{ view().memberCount | count: 'member' }}</span>
      </button>
    }
  }

  @if (showPinChip()) {
    <button
      type="button"
      class="header__pins"
      [attr.aria-label]="pinChipLabel()"
      (click)="pinnedRequested.emit()"
    >
      <app-icon name="pin" [size]="13" />
      {{ pinnedCount() }}
    </button>
  }

  <div class="header__actions">
    @if (!compact()) {
      <button
        appIconButton
        type="button"
        label="Search in conversation"
        [pressed]="searchOpen()"
        (click)="searchToggled.emit()"
      >
        <app-icon name="search" [size]="18" />
      </button>
      <button
        appIconButton
        type="button"
        class="header__star"
        [label]="starLabel()"
        [pressed]="starred()"
        (click)="starToggled.emit()"
      >
        <app-icon name="star" [size]="18" [filled]="starred()" />
      </button>
    }
    <button
      appIconButton
      type="button"
      label="Conversation details"
      [pressed]="detailsOpen()"
      (click)="detailsToggled.emit()"
    >
      <app-icon name="panel-right" [size]="18" />
    </button>
    <button
      appIconButton
      type="button"
      label="More actions"
      [cdkMenuTriggerFor]="moreMenu"
      [cdkMenuPosition]="menuPositions"
    >
      <app-icon name="ellipsis-vertical" [size]="18" />
    </button>
  </div>
</header>

<ng-template #moreMenu>
  <div appDropdownPanel="Conversation actions">
    <app-dropdown label="Conversation actions" width="md">
      @if (compact()) {
        <button appDropdownItem (triggered)="searchToggled.emit()">
          <app-icon name="search" [size]="18" />
          Search in conversation
        </button>
      }
      <button appDropdownItem (triggered)="starToggled.emit()">
        <app-icon name="star" [size]="18" />
        {{ starLabel() }}
      </button>
      <button appDropdownItem (triggered)="muteToggled.emit()">
        <app-icon [name]="muted() ? 'bell' : 'bell-off'" [size]="18" />
        {{ muted() ? 'Unmute' : 'Mute notifications' }}
      </button>
      <button appDropdownItem (triggered)="markedUnread.emit()">
        <app-icon name="circle-dot" [size]="18" />
        Mark as unread
      </button>
      <button appDropdownItem (triggered)="pinnedRequested.emit()">
        <app-icon name="pin" [size]="18" />
        View pinned messages
      </button>
      <button appDropdownItem (triggered)="linkCopied.emit()">
        <app-icon name="link" [size]="18" />
        Copy link
      </button>
      @if (view().type !== 'dm') {
        <app-dropdown-divider />
        <button appDropdownItem (triggered)="left.emit()">
          <app-icon name="log-out" [size]="18" />
          {{ leaveLabel() }}
        </button>
      }
    </app-dropdown>
  </div>
</ng-template>
