<form class="password-form" aria-labelledby="settings-password-title" [formRoot]="passwordForm">
  <h3 id="settings-password-title" class="password-form__title">Change password</h3>
  <div class="password-form__fields">
    <app-input
      label="Current password"
      type="password"
      autocomplete="current-password"
      [formField]="passwordForm.current"
    />
    <app-input
      label="New password"
      type="password"
      autocomplete="new-password"
      [formField]="passwordForm.next"
    />
    <app-input
      label="Confirm new password"
      type="password"
      autocomplete="new-password"
      [formField]="passwordForm.confirmation"
    />
  </div>
  <div>
    <button appButton type="submit" variant="primary">Update password</button>
  </div>
</form>
