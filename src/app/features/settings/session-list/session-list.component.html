<section class="sessions" aria-labelledby="settings-sessions-title">
  <div class="sessions__header">
    <h3 #heading id="settings-sessions-title" class="sessions__title" tabindex="-1">
      Active sessions
    </h3>
    <button
      appButton
      type="button"
      variant="ghost"
      size="sm"
      [disabled]="!canSignOutOthers()"
      (click)="revokeOthers()"
    >
      Sign out other sessions
    </button>
  </div>

  @switch (status()) {
    @case ('loading') {
      <app-skeleton layout="list" [rows]="3" compact label="Loading sessions" />
    }
    @case ('error') {
      <app-empty-state
        kind="error"
        compact
        [headingLevel]="4"
        heading="Couldn’t load your sessions"
        actionLabel="Try again"
        (action)="reload()"
      />
    }
    @default {
      <ul class="sessions__list">
        @for (session of sessions(); track session.id) {
          <li class="session">
            <span class="session__tile" aria-hidden="true">
              <app-icon [name]="session.icon" [size]="18" />
            </span>
            <span class="session__text">
              <strong class="session__device">{{ session.device }}</strong>
              <span class="session__meta">{{ session.location }} · {{ session.lastActive }}</span>
            </span>
            @if (session.current) {
              <app-tag tone="outline">This device</app-tag>
            } @else {
              <button
                #revokeButton
                appButton
                type="button"
                size="sm"
                [attr.aria-label]="'Revoke session on ' + session.device"
                (click)="revoke(session)"
              >
                Revoke
              </button>
            }
          </li>
        }
      </ul>
    }
  }
</section>
