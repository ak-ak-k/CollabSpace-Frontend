<span class="setting-row__text">
  <strong class="setting-row__label">{{ label() }}</strong>
  @if (description()) {
    <span class="setting-row__description">{{ description() }}</span>
  }
</span>
<span class="setting-switch__control">
  <app-toggle hideLabel [label]="label()" [description]="description()" [(checked)]="checked" />
</span>
