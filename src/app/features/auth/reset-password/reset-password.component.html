<form class="auth-form" aria-labelledby="auth-title" [formRoot]="resetForm">
  <a class="auth-form__back" routerLink="/login">
    <app-icon name="arrow-left" [size]="16" />
    Back to log in
  </a>
  <div class="auth-form__header">
    <h1 class="auth-form__title" id="auth-title">Choose a new password</h1>
    <p class="auth-form__subtitle">
      Use at least 8 characters. Other devices will be signed out once you reset.
    </p>
  </div>

  <div class="auth-form__group">
    <app-input
      label="New password"
      type="password"
      size="lg"
      revealable
      autocomplete="new-password"
      placeholder="At least 8 characters"
      [formField]="resetForm.password"
    />
    <app-password-strength [password]="resetForm.password().value()" />
  </div>
  <app-input
    label="Confirm new password"
    type="password"
    size="lg"
    autocomplete="new-password"
    placeholder="Repeat the password"
    [formField]="resetForm.confirmPassword"
  />

  <button
    appButton
    type="submit"
    variant="primary"
    size="xl"
    block
    [busy]="submitting()"
    [disabled]="submitting()"
  >
    @if (submitting()) {
      Resetting…
    } @else {
      Reset password
      <app-icon name="arrow-right" [size]="16" />
    }
  </button>
</form>
