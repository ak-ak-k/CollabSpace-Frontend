<app-drawer heading="Menu" hideHeading>
  @if (me(); as user) {
    <div drawerHeader class="drawer-menu__identity">
      <app-avatar [name]="user.name" [seed]="mySeed()" [size]="48" [status]="user.status" />
      <span class="drawer-menu__text">
        <span class="drawer-menu__name truncate">{{ user.name }}</span>
        <span class="drawer-menu__summary truncate">{{ summary() }}</span>
      </span>
    </div>
  }

  @if (me(); as user) {
    <section class="drawer-menu__section" aria-labelledby="drawer-status-heading">
      <h3 class="caps-label drawer-menu__heading" id="drawer-status-heading">Set status</h3>
      <div class="drawer-menu__statuses">
        @for (option of statusOptions; track option.status) {
          <button
            type="button"
            class="drawer-menu__status"
            [class.drawer-menu__status--current]="user.status === option.status"
            [attr.aria-pressed]="user.status === option.status"
            (click)="setStatus(option)"
          >
            <app-status-dot [status]="option.status" size="sm" />
            {{ option.label }}
          </button>
        }
      </div>
    </section>
  }

  <nav class="drawer-menu__links" aria-label="More">
    @for (link of links; track link.id) {
      <a class="drawer-menu__row" [routerLink]="link.route" (click)="close()">
        <app-icon [name]="link.icon" [size]="20" />
        <span class="drawer-menu__row-label">{{ link.label }}</span>
        <app-badge [count]="badges.countFor(link)" [label]="badges.countFor(link) + ' unread'" />
      </a>
    }
  </nav>

  <div class="drawer-menu__switches">
    <div class="drawer-menu__switch">
      <app-icon name="moon" [size]="20" />
      <app-toggle
        label="Dark mode"
        [checked]="theme.isDark()"
        (checkedChange)="theme.setPreference($event ? 'dark' : 'light')"
      />
    </div>
    <div class="drawer-menu__switch">
      <app-icon name="wifi-off" [size]="20" />
      <app-toggle
        label="Simulate offline"
        [checked]="network.simulatedOffline()"
        (checkedChange)="network.simulateOffline($event)"
      />
    </div>
    @if (devTools) {
      <div class="drawer-menu__switch">
        <app-icon name="cloud-off" [size]="20" />
        <app-toggle
          label="Make sync fail"
          [checked]="network.simulatedSyncFailure()"
          (checkedChange)="network.simulateSyncFailure($event)"
        />
      </div>
    }
  </div>

  @if (installer.canInstall()) {
    <button type="button" class="drawer-menu__row" (click)="install()">
      <app-icon name="download" [size]="20" />
      <span class="drawer-menu__row-label">Install CollabSpace</span>
    </button>
  }
  @if (installer.canAddToHomeScreen()) {
    <button type="button" class="drawer-menu__row" (click)="explainHomeScreen()">
      <app-icon name="smartphone" [size]="20" />
      <span class="drawer-menu__row-label">Add to Home Screen</span>
    </button>
  }

  <button type="button" class="drawer-menu__row" aria-haspopup="menu" (click)="switchWorkspace()">
    <app-icon name="chevrons-up-down" [size]="20" />
    <span class="drawer-menu__row-label">Switch workspace</span>
    <span class="drawer-menu__count">{{ workspaceCount() | count: 'workspace' }}</span>
  </button>

  <button drawerFooter appButton type="button" block size="lg" (click)="signOut()">
    <app-icon name="log-out" [size]="18" />
    Sign out
  </button>
</app-drawer>
