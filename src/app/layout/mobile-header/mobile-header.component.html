<header class="mobile-header">
  <button
    type="button"
    class="mobile-header__menu"
    aria-label="Open menu"
    aria-haspopup="dialog"
    (click)="menuRequested.emit()"
  >
    <app-brand-mark size="sm" />
    <span class="mobile-header__workspace truncate">{{ workspaceName() }}</span>
    <app-icon name="chevron-down" [size]="16" />
  </button>

  <span class="mobile-header__spacer"></span>

  <button appIconButton size="lg" label="Search" (click)="searchRequested.emit()">
    <app-icon name="search" [size]="20" />
  </button>
  <a
    appIconButton
    size="lg"
    class="mobile-header__notifications"
    routerLink="/notifications"
    [label]="notificationsLabel()"
  >
    <app-icon name="bell" [size]="20" />
    <app-badge class="mobile-header__badge" size="sm" [count]="unreadCount()" />
  </a>
</header>
